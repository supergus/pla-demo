name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/test-cost.mjs
      - run: node tests/gate.test.mjs
      - run: node tests/middleware.test.mjs
      - run: node tests/actual-gated.test.mjs
      - run: node tests/leaf-tender-gated.test.mjs
      - run: node tests/leafTenderRedirect.test.mjs
